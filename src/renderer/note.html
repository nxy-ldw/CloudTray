<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'" />
    <title>便签</title>
    <link rel="stylesheet" href="sticky.css" />
  </head>
  <body class="kind-note">
    <div class="sticky">
      <div class="head">
        <div class="title" id="title" title="单击可重命名">便签</div>
        <div class="swatches" id="swatches"></div>
        <button class="hbtn" id="btn-close" title="关闭">✕</button>
      </div>
      <div class="body">
        <textarea id="editor" placeholder="输入便签内容…" spellcheck="false"></textarea>
      </div>
      <div class="foot">
        <span id="status"></span>
        <span id="counter"></span>
      </div>
    </div>
    <script src="common/ui.js"></script>
    <script src="note.js"></script>
  </body>
</html>
